<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Library Management System</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="container">
    <h1>Library Management System</h1>
    <p class="subtitle">Add and manage your library books</p>

    <form id="bookForm">
      <input id="bookTitle" type="text" placeholder="Book title" required>
      <input id="bookAuthor" type="text" placeholder="Author name" required>
      <button type="submit">Add Book</button>
    </form>

    <h2>Book List</h2>
    <p id="emptyMessage">No books added yet.</p>
    <ul id="bookList"></ul>
  </main>
  <script src="script.js"></script>
</body>
</html>
